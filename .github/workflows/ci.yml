name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: ${{ !github.event.repository.private }}
    name: ci / matrix
    uses: swift-institute/.github/.github/workflows/swift-ci.yml@main
    with:
      lint-bundle: institute

  notify-linter-republish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private }}
    uses: swift-institute/.github/.github/workflows/notify-linter-republish.yml@main
    secrets:
      SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
